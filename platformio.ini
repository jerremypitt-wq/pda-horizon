; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = elecrow-adv-35-horizon

[device-ui_base]
lib_deps =
  # Пин вместо #master (вариант A): master на 2026-10-13.
  https://github.com/jerremypitt-wq/device-ui#9ec70c8aedbf23e5ef8accb4246bd4cbcac82c77

[env]
platform = espressif32@6.9.0
framework = arduino
upload_protocol = esp-builtin
monitor_speed = 115200 ; логи main.cpp идут на 115200 (Serial.begin)
board_build.filesystem = littlefs
extra_scripts =
  ./bin/littlefsbuilder.py
  ./bin/ld_map_workaround.py ; относительный -Map при не-ASCII пути проекта
  ./bin/patch_deviceui_boot.py ; чёрный вместо зелени Meshtastic при загрузке
  ./bin/patch_deviceui_uartmon.py ; счётчики UART-трафика от радио (диагностика)
build_type = release
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=c++11
    -std=c++14
build_flags = -std=c++17 -std=gnu++17 -Os -ffunction-sections -fdata-sections -Wl,--gc-sections
  -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
  -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
  -DCONFIG_ARDUHAL_ESP_LOG
  -DCONFIG_ARDUHAL_LOG_COLORS=1
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_COMP_CONF_INCLUDE_SIMPLE
  -DLV_BUILD_TEST=0
  -I src
  -I src/mesh/generated
lib_deps =
  ${device-ui_base.lib_deps}
  lovyan03/LovyanGFX@1.2.28

; ПДА «Горизонт» — игровая прошивка для страйкбольных ролевых игр
; по мотивам S.T.A.L.K.E.R. (см. docs/HORIZON.md).
; Тот же CrowPanel Advance 3.5", но вместо штатного MUI — свой интерфейс:
; меню-плитки, общий/групповой чаты, объявления, контакты, лички, досье.
; Драйвер панели LGFX_ELECROW_ADV_35 (variants/elecrow-adv-35/config.h)
; создаётся напрямую в src/horizon/HorizonDisplay.cpp. Глобальный -include
; config.h здесь НЕ используется: он втыкает LovyanGFX в каждую единицу
; трансляции, что ломает LDF чужих библиотек и даёт конфликт имён
; (глобальный lgfx `namespace fonts` против глобального массива `fonts[]`
; из generated/ui_320x240/fonts.h). DisplayDriverFactory из device-ui
; в этой прошивке не вызывается, но обязан компилироваться (там #error
; без LGFX_DRIVER), поэтому ниже — жертвенный шаблонный драйвер
; LGFX_GENERIC с dummy-пинами (паттерн штатных MUI-окружений под SPI-панели):
; фабрика его инстанцирует, но в рантайме он не создаётся никогда.

[env:elecrow-adv-35-horizon]
board = elecrow-adv-35
upload_protocol = esptool
board_build.partitions = default_16MB.csv
build_type = release
build_flags = ${env.build_flags} -O2
  -D ARCH_ESP32
  -D ELECROW_ADV_35
  -D HORIZON_UI
  -D USE_ILOG
  -D LV_USE_LOG=0
  -D USE_SERIAL2
  -D WAIT_FOR_SERIAL0
  -D SERIAL_RX=44           ; == variants/elecrow-adv-35/config.h
  -D SERIAL_TX=43
  -D HAS_TFT=1
  -D RAM_SIZE=1560
  -D DISPLAY_SET_RESOLUTION ; физика 480x320
  -D LGFX_DRIVER_TEMPLATE
  -D LGFX_DRIVER=LGFX_GENERIC
  -D LGFX_PANEL=ST7789
  -D LGFX_OFFSET_ROTATION=1
  -D LGFX_TOUCH=XPT2046
  -D LGFX_PIN_SCK=7
  -D LGFX_PIN_MOSI=11
  -D LGFX_PIN_MISO=9
  -D LGFX_PIN_CS=12
  -D LGFX_PIN_DC=3
  -D LGFX_PIN_RST=4
  -D LGFX_PIN_BL=16
  -D LGFX_TOUCH_INT=-1
  -D LGFX_TOUCH_CS=-1
  -D LGFX_TOUCH_CLK=-1
  -D LGFX_TOUCH_DO=-1
  -D LGFX_TOUCH_DIN=-1
  -D LGFX_TOUCH_X_MIN=300
  -D LGFX_TOUCH_X_MAX=3900
  -D LGFX_TOUCH_Y_MIN=400
  -D LGFX_TOUCH_Y_MAX=3900
  -D VIEW_320x240           ; шрифты с кириллицей + lv_i18n из device-ui
  -I lib
  -I lib/mesh/generated
  -I variants/elecrow-adv-35 ; для #include "config.h" в HorizonDisplay.cpp
build_src_filter = ${env.build_src_filter}
  +<../lib/mesh>
lib_deps = ${env.lib_deps}
  LittleFS
